name: Steward

# Low-touch upkeep for a specification that is deliberately not under active
# development. It does two jobs.
#
# 1. Nobody is left waiting. The contributors are the only part of this
#    project that appreciates while it is ignored, and the way to lose them
#    is to let a pull request sit unanswered for a month. This looks for open
#    issues and PRs opened by someone other than the maintainer that have had
#    no maintainer reply, and FAILS the run if any are older than the grace
#    period. GitHub emails the repository owner when a scheduled workflow
#    fails, so the alert is private and needs no secrets, no third-party
#    service and no account. Nothing is posted publicly: a bot announcing
#    "3 contributions awaiting reply" on an open standard is worse than
#    silence.
#
# 2. The automation does not switch itself off. GitHub disables scheduled
#    workflows after 60 days without repository activity, and a repository
#    with no active development is exactly the case that triggers it. Once a
#    month this commits a heartbeat file, which counts as activity and keeps
#    both this workflow and Spec CI alive. Monthly rather than weekly keeps
#    the commit log readable while leaving roughly 2x margin on the 60 days.

on:
  schedule:
    - cron: '41 7 * * 1'   # Mondays, 07:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  # Maintainers are resolved from the repository's collaborator list at run
  # time rather than hardcoded, so this file carries no personal handle and
  # stays correct if the maintainer set changes.
  GRACE_DAYS: '7'

jobs:
  steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2. Heartbeat, once per calendar month ----------------------------
      - name: Monthly heartbeat commit
        run: |
          set -euo pipefail
          month=$(date -u +%Y-%m)
          file=.github/heartbeat.txt
          if [ -f "$file" ] && grep -q "^$month\$" "$file"; then
            echo "Heartbeat for $month already recorded; no commit needed."
            exit 0
          fi
          printf '%s\n' "$month" > "$file"
          git config user.name  'context-passport-steward'
          git config user.email 'actions@github.com'
          git add "$file"
          git commit -m "chore: steward heartbeat $month

          Keeps scheduled workflows from being auto-disabled after 60 days
          of repository inactivity. See .github/workflows/steward.yml."
          git push
          echo "Heartbeat committed for $month."

      # 1. Unanswered external contributions -----------------------------
      - name: Check for contributions awaiting a reply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          gh issue list  --repo "$REPO" --state open --limit 100 \
            --json number,title,author,createdAt,url > issues.json
          gh pr list     --repo "$REPO" --state open --limit 100 \
            --json number,title,author,createdAt,url > prs.json
          node .github/steward-check.mjs
